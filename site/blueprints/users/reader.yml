title: Lecteur

description: |
  Ce rôle permet d'accéder au contenu et de le modifier
  <br>Il ne permet pas de supprimer, ajouter, déplacer ou de modifier le status d'une page.

permissions:
  access:
    panel: true
    settings: false
    users: false
  pages:
    create: false
    delete: false
    changeSlug: false
    changeStatus: false
    changeTemplate: false
    changeTitle: false
    duplicate: false
    move: false
  files:
    create: false
    update: false
    delete: false
    replace: false
  user:
    changeEmail: false
    changeLanguage: false
    changeName: false
    changePassword: false
    changeRole: false
    delete: false

fields:
  user_role_info:
    type: info
    label: Informations
    theme: none
    text: |
      Ce rôle permet d'accéder au contenu et de le modifier
      Il ne permet pas de supprimer, ajouter, déplacer ou de modifier le status d'une page.
